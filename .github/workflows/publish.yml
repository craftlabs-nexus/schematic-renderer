# Publishes @craftlabs/schematic-renderer to npm when a version tag is pushed:
#   npm version patch      (or minor; or edit package.json: the tag must match its version)
#   git push origin master
#   git push origin v1.2.3 (the tag alone: GitHub starts no workflow for a push of more than three tags)
# Authenticates with npm trusted publishing (OIDC; set up on npmjs.com for this repository and this workflow,
# allowed to publish), so no token is stored; npm adds provenance by itself. Needs npm 11.5.1 or later.
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # the version in package.json's packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check that the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Test
        run: pnpm run test:run

      - name: Build
        run: pnpm run build

      - name: npm for trusted publishing (11.5.1 or later; Node 22 bundles 10)
        run: npm install -g npm@^11.5.1

      - name: Publish (trusted publishing, provenance)
        run: npm publish --access public
