# Publishes @craftlabs-nexus/schematic-renderer to npm when a version tag is pushed:
#   npm version minor      (or edit package.json; the tag must match its version)
#   git push origin master --tags
# Needs the NPM_TOKEN secret (an npm automation token for the @craftlabs-nexus scope), or
# npm trusted publishing set up for this repository, in which case the token is not read.
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
